[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-cms"
version = "0.1.0"
description = "A lightweight CMS parser for Markdown content with frontmatter"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "KTrain5369", email = "contact@ktrain5369.me"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "python-frontmatter>=1.0.0",
    "markdown>=3.0.0",
    "pydantic>=1.8.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/scientific-cms"
Repository = "https://github.com/yourusername/scientific-cms"